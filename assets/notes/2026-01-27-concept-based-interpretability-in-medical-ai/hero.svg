<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="title desc">
  <title id="title">Concepts emerging from a latent representation</title>
  <desc id="desc">A dense, entangled representation gradually resolves into three sparse and distinct concept directions.</desc>
  <defs>
    <linearGradient id="edge-fade" x1="0" x2="1"><stop offset="0" stop-color="black"/><stop offset=".13" stop-color="white"/><stop offset=".87" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
    <mask id="fade-mask"><rect width="720" height="200" fill="url(#edge-fade)"/></mask>
    <radialGradient id="latent-wash" cx="45%" cy="50%" r="55%"><stop offset="0" stop-color="#9a7b57" stop-opacity=".12"/><stop offset="1" stop-color="#9a7b57" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .ink{fill:none;stroke:#6f665d;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#9a7b57;stroke-linecap:round}.dot{fill:#6f665d}.focus{fill:#49433e}.ambient{opacity:.12}.structure{opacity:.29}.resolved{opacity:.58}.breath{animation:breathe 28s ease-in-out infinite alternate;transform-origin:380px 100px}.drift{animation:drift 36s ease-in-out infinite alternate;transform-origin:300px 100px}@keyframes breathe{from{opacity:.86}to{opacity:1}}@keyframes drift{from{transform:translate(-1.5px,.8px)}to{transform:translate(1.5px,-.8px)}}@media(prefers-reduced-motion:reduce){.breath,.drift{animation:none}}
  </style>
  <g mask="url(#fade-mask)">
    <ellipse cx="286" cy="101" rx="145" ry="73" fill="url(#latent-wash)"/>
    <g class="ambient ink" stroke-width=".65">
      <path d="M84 113C128 58 205 45 270 67c60 21 86 61 146 66 61 6 99-26 191-22"/><path d="M91 124c51-52 113-66 172-49 62 18 87 64 151 68 61 4 112-27 207-21"/><path d="M103 94c47-46 111-55 178-34 61 19 87 55 139 60 63 6 97-29 190-24"/><path d="M116 137c55-40 106-52 161-43 53 9 86 57 143 60 55 3 110-18 174-14"/><path d="M123 78c44-29 101-31 151-13 48 17 83 38 132 39 52 1 95-24 170-21"/><path d="M151 151c45-26 88-35 134-32 52 4 82 41 139 44 43 2 83-9 130-9"/>
    </g>
    <g class="drift">
      <g class="dot" opacity=".17">
        <circle cx="122" cy="101" r=".8"/><circle cx="137" cy="84" r=".7"/><circle cx="143" cy="118" r="1"/><circle cx="155" cy="68" r=".65"/><circle cx="160" cy="99" r=".85"/><circle cx="168" cy="132" r=".7"/><circle cx="178" cy="79" r="1"/><circle cx="184" cy="110" r=".7"/><circle cx="190" cy="145" r=".65"/><circle cx="197" cy="57" r=".7"/><circle cx="202" cy="92" r=".8"/><circle cx="207" cy="123" r="1"/><circle cx="218" cy="73" r=".65"/><circle cx="220" cy="105" r=".9"/><circle cx="226" cy="139" r=".75"/><circle cx="237" cy="52" r=".7"/><circle cx="242" cy="87" r="1"/><circle cx="245" cy="117" r=".75"/><circle cx="255" cy="69" r=".8"/><circle cx="260" cy="100" r="1.1"/><circle cx="263" cy="133" r=".65"/><circle cx="275" cy="53" r=".65"/><circle cx="278" cy="83" r=".8"/><circle cx="283" cy="116" r="1"/><circle cx="292" cy="68" r=".75"/><circle cx="297" cy="97" r="1.1"/><circle cx="301" cy="142" r=".7"/><circle cx="309" cy="80" r=".65"/><circle cx="314" cy="111" r=".9"/><circle cx="321" cy="128" r=".7"/><circle cx="328" cy="61" r=".75"/><circle cx="334" cy="94" r="1"/><circle cx="340" cy="147" r=".65"/>
      </g>
      <g class="dot" opacity=".34">
        <circle cx="173" cy="103" r="1.05"/><circle cx="198" cy="99" r=".85"/><circle cx="215" cy="113" r="1.2"/><circle cx="232" cy="94" r=".9"/><circle cx="251" cy="108" r="1.15"/><circle cx="269" cy="91" r=".8"/><circle cx="286" cy="105" r="1.2"/><circle cx="304" cy="99" r=".9"/><circle cx="319" cy="115" r="1.05"/><circle cx="337" cy="101" r="1.15"/><circle cx="350" cy="119" r=".8"/>
      </g>
    </g>
    <g class="breath">
      <g class="structure ink" stroke-width=".72">
        <path d="M254 108c67-2 96-11 134-29 43-21 79-31 147-29"/><path d="M254 108c72 0 111 0 154-3 54-4 102-3 175 6"/><path d="M254 108c69 4 102 17 143 31 40 14 79 19 151 11"/><path d="M276 101c52-3 76-13 110-29 44-21 88-32 139-29"/><path d="M275 116c50 4 80 17 119 30 43 15 83 20 137 12"/>
      </g>
