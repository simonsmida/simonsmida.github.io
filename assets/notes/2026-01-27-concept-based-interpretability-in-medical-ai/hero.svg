      <g class="focus"><circle cx="535" cy="50" r="2.15"/><circle cx="583" cy="111" r="2.35"/><circle cx="548" cy="150" r="2.05"/></g>
      <g class="dot" opacity=".34"><circle cx="513" cy="47" r=".85"/><circle cx="522" cy="56" r=".65"/><circle cx="545" cy="45" r=".7"/><circle cx="558" cy="105" r=".75"/><circle cx="572" cy="117" r=".65"/><circle cx="596" cy="106" r=".8"/><circle cx="524" cy="153" r=".7"/><circle cx="538" cy="143" r=".75"/><circle cx="563" cy="155" r=".65"/></g>
    </g>
  </g>
</svg>
