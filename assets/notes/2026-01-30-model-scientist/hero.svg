      <g class="clear accent" stroke-width="1"><path d="M99 104c99-2 178-4 250-3 13 0 21 0 28 0 44 0 77 2 117 4 48 2 92 0 148-2"/><path d="M377 101c42 0 64-19 95-27 34-9 66-5 96 4 24 7 45 8 68 4"/></g>
      <g class="focus"><circle cx="377" cy="101" r="2.7"/></g><g fill="#9a7b57" opacity=".68"><circle cx="472" cy="74" r="1.8"/><circle cx="568" cy="78" r="1.45"/><circle cx="636" cy="82" r="1.25"/></g>
