      <g class="ink" opacity=".2" stroke-width=".72"><path d="M101 71v26m12-35v43m13-27v20m13-43v54m15-40v31m14-50v62m15-39v25m15-39v49m16-30v18m17-42v58m17-46v34m18-52v67m17-43v27m18-38v45m18-27v20"/></g>
      <g class="dot" opacity=".25"><circle cx="101" cy="71" r=".8"/><circle cx="113" cy="62" r=".7"/><circle cx="126" cy="78" r=".9"/><circle cx="139" cy="55" r=".65"/><circle cx="154" cy="69" r=".85"/><circle cx="168" cy="50" r=".7"/><circle cx="183" cy="73" r=".9"/><circle cx="198" cy="59" r=".7"/><circle cx="214" cy="78" r=".8"/><circle cx="231" cy="54" r=".65"/><circle cx="248" cy="66" r=".9"/><circle cx="266" cy="48" r=".7"/><circle cx="283" cy="72" r=".85"/><circle cx="301" cy="61" r=".7"/><circle cx="319" cy="79" r=".8"/></g>
    </g>
    <g class="breathe">
