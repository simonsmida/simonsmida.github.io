<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="title desc">
  <title id="title">A hidden biological signal becoming legible</title>
  <desc id="desc">Many weak fragment-length traces concentrate through a narrow interpretability bottleneck and emerge as one clear, testable signal.</desc>
  <defs>
    <linearGradient id="edge-fade" x1="0" x2="1"><stop offset="0" stop-color="black"/><stop offset=".14" stop-color="white"/><stop offset=".88" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
    <mask id="fade-mask"><rect width="720" height="200" fill="url(#edge-fade)"/></mask>
    <radialGradient id="focus-wash"><stop offset="0" stop-color="#9a7b57" stop-opacity=".16"/><stop offset=".55" stop-color="#9a7b57" stop-opacity=".045"/><stop offset="1" stop-color="#9a7b57" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .ink{fill:none;stroke:#6f665d;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#9a7b57;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#6f665d}.focus{fill:#49433e}.ambient{opacity:.11}.signal{opacity:.27}.clear{opacity:.62}.breathe{animation:breathe 30s ease-in-out infinite alternate}.shift{animation:shift 38s ease-in-out infinite alternate;transform-origin:360px 100px}@keyframes breathe{from{opacity:.84}to{opacity:1}}@keyframes shift{from{transform:translateY(-1px)}to{transform:translateY(1px)}}@media(prefers-reduced-motion:reduce){.breathe,.shift{animation:none}}
  </style>
  <g mask="url(#fade-mask)">
