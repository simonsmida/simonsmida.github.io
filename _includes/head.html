<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ include.description | default: page.description | default: site.description }}">
<meta name="theme-color" content="#eef2f3">
<title>{% if include.title %}{{ include.title }} — {% endif %}Šimon Šmída</title>
<link rel="icon" href="/assets/icons/favicon.svg?v={{ site.version }}" type="image/svg+xml" data-theme-icon data-light="/assets/icons/favicon.svg?v={{ site.version }}" data-dark="/assets/icons/favicon-dark.svg?v={{ site.version }}">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v={{ site.version }}">
<script>
  /* Apply the saved theme and matching favicon before the first paint. */
  (() => {
    const root = document.documentElement;
    let theme = "slate-blue";
    let field = "manifold";
    try {
      if (localStorage.getItem("site-theme") === "midnight-navy") theme = "midnight-navy";
      field = localStorage.getItem("site-field") || field;
    } catch {}
    root.dataset.theme = theme;
    root.dataset.field = field;
    const icon = document.querySelector("[data-theme-icon]");
    icon.href = theme === "midnight-navy" ? icon.dataset.dark : icon.dataset.light;
    document.querySelector('meta[name="theme-color"]').content = theme === "midnight-navy" ? "#101d27" : "#eef2f3";
  })();
</script>
<link rel="stylesheet" href="/assets/css/site.css?v={{ site.version }}">
