<svg class="article-hero-svg model-landscape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="model-hero-title model-hero-desc">
  <title id="model-hero-title">Interpretability landscape</title>
  <desc id="model-hero-desc">A field of contour lines forms a large hill, a dense central basin with sparse activation spikes, and smaller waves that resolve toward the right.</desc>
  <defs>
    <linearGradient id="model-edge-fade" x1="0" x2="1">
      <stop offset="0" stop-color="black"/><stop offset=".08" stop-color="white"/><stop offset=".93" stop-color="white"/><stop offset="1" stop-color="black"/>
    </linearGradient>
    <radialGradient id="model-basin-glow" cx="50%" cy="62%" r="42%">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".14"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
    </radialGradient>
    <mask id="model-fade"><rect width="1600" height="600" fill="url(#model-edge-fade)"/></mask>
  </defs>
  <style>
    .model-landscape .contour{fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;vector-effect:non-scaling-stroke}
    .model-landscape .fine{opacity:.13}.model-landscape .mid{opacity:.22}.model-landscape .near{opacity:.34}
    .model-landscape .accent-line{fill:none;stroke:var(--accent);stroke-width:1.15;stroke-linecap:round;opacity:.48;vector-effect:non-scaling-stroke}
    .model-landscape .spike{stroke:currentColor;stroke-width:.9;opacity:.42;vector-effect:non-scaling-stroke}
    .model-landscape .spike-dot{fill:var(--ink);opacity:.72}.model-landscape .particle{fill:currentColor}.model-landscape .accent-dot{fill:var(--accent)}
    .model-landscape .ascii{fill:currentColor;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;letter-spacing:3px;opacity:.28}
    .model-landscape .dense{font-size:13px;letter-spacing:2px;opacity:.42}
    .model-landscape .wave-1{animation:model-wave-a 16s ease-in-out infinite alternate;transform-origin:50% 70%}
    .model-landscape .wave-2{animation:model-wave-b 19s ease-in-out infinite alternate;transform-origin:50% 70%}
    .model-landscape .wave-3{animation:model-wave-c 23s ease-in-out infinite alternate;transform-origin:50% 70%}
    .model-landscape .wave-4{animation:model-wave-d 25s ease-in-out infinite alternate;transform-origin:50% 70%}
    .model-landscape .wave-5{animation:model-wave-e 21s ease-in-out infinite alternate;transform-origin:50% 70%}
    .model-landscape .particle-field{animation:model-breathe 18s ease-in-out infinite alternate}
    @keyframes model-wave-a{from{transform:translateY(-1px) scaleY(.997)}to{transform:translateY(2px) scaleY(1.006)}}
    @keyframes model-wave-b{from{transform:translateY(1px) scaleY(1.003)}to{transform:translateY(-2px) scaleY(.996)}}
    @keyframes model-wave-c{from{transform:translateY(-1px)}to{transform:translateY(1.5px)}}
    @keyframes model-wave-d{from{transform:translateY(1.5px) scaleY(.999)}to{transform:translateY(-1px) scaleY(1.004)}}
    @keyframes model-wave-e{from{transform:translateY(-2px)}to{transform:translateY(1px)}}
    @keyframes model-breathe{from{opacity:.72}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.hero-art *{animation:none!important}}
  </style>
  <g mask="url(#model-fade)">
    <ellipse cx="815" cy="397" rx="370" ry="185" fill="url(#model-basin-glow)"/>
    <g class="wave-1 fine contour">
      <path d="M15 316C163 339 255 157 421 176c151 18 173 225 348 251 167 25 231-115 355-72 126 44 183-95 318-119 68-12 112 9 143 38"/>
      <path d="M8 332c151 21 252-153 416-134 148 18 172 217 346 244 170 27 232-105 356-64 127 42 184-89 320-111 67-11 111 10 143 38"/>
      <path d="M6 349c151 18 253-146 421-125 145 18 168 209 344 236 169 26 234-96 358-57 128 40 183-82 319-102 67-10 111 11 145 39"/>
    </g>
    <g class="wave-2 fine contour">
      <path d="M22 365c151 14 258-138 426-116 143 19 163 201 340 228 167 25 232-87 357-49 128 39 185-75 322-95 65-9 108 12 143 40"/>
      <path d="M29 382c149 10 260-131 428-107 141 20 160 193 337 220 165 25 230-79 356-42 129 38 189-69 326-87 63-8 105 13 141 41"/>
      <path d="M38 399c146 7 260-122 427-98 140 21 159 184 335 212 163 25 227-71 354-34 130 38 191-63 329-80 61-7 102 15 139 42"/>
    </g>
    <g class="wave-3 mid contour">
      <path d="M49 416c143 3 261-113 428-88 140 21 155 176 331 204 161 26 225-63 352-27 132 38 195-57 333-72 59-6 99 16 137 43"/>
      <path d="M62 433c140 0 260-104 426-79 140 21 152 168 328 196 159 25 222-55 350-19 133 37 199-51 337-65 57-5 96 18 134 44"/>
      <path d="M76 450c136-4 259-95 424-69 140 21 150 159 325 187 157 26 220-47 348-11 134 37 202-45 341-57 55-4 92 19 131 45"/>
    </g>
    <g class="wave-4 near contour">
      <path d="M93 467c132-7 257-86 422-60 139 22 147 151 322 179 155 25 216-39 345-4 135 37 206-39 345-49 53-3 88 20 128 46"/>
      <path d="M112 484c127-10 254-77 419-50 138 22 145 142 319 170 153 25 214-31 343 4 137 36 210-33 349-42 51-2 85 22 125 47"/>
      <path d="M133 501c122-14 250-68 414-41 138 23 143 134 317 162 151 25 211-23 341 11 138 36 213-27 353-34 49-1 81 23 122 48"/>
    </g>
    <g class="wave-5 mid contour">
      <path d="M171 520c111-17 235-57 391-29 133 24 134 116 300 144 144 24 201-8 329 26 136 36 216-12 346-17 45-1 75 22 112 44"/>
      <path d="M208 537c101-19 219-47 367-19 127 24 128 99 286 127 137 24 192 7 316 40 132 35 209 3 330-1 42-1 70 20 104 39"/>
    </g>
    <path class="accent-line" d="M61 347c155 16 258-143 422-120 143 20 164 202 338 229 169 27 231-90 356-52 128 39 188-77 323-96 61-8 100 12 132 37"/>
    <g class="particle-field">
      <g class="ascii">
        <text x="190" y="320">.  :  .   - .  :   .</text><text x="295" y="368">.:  -  . : + .  :</text><text x="477" y="397">. : -  + : .  -</text>
        <text class="dense" x="598" y="430">..::--++***++--::..</text><text class="dense" x="655" y="456">.:--+**++++**+--:.</text><text class="dense" x="716" y="480">::++***+**++--:.</text>
        <text class="dense" x="815" y="489">..:--++***++--::.</text><text x="1010" y="423">. : +  - : .  :</text><text x="1190" y="388">.  :  . -  + .</text>
      </g>
      <g class="particle" opacity=".2">
        <circle cx="232" cy="285" r="2"/><circle cx="319" cy="248" r="2.4"/><circle cx="391" cy="221" r="1.7"/><circle cx="454" cy="265" r="2.2"/>
        <circle cx="538" cy="346" r="1.8"/><circle cx="590" cy="392" r="2.4"/><circle cx="642" cy="430" r="1.6"/><circle cx="704" cy="452" r="2"/>
        <circle cx="767" cy="472" r="2.4"/><circle cx="842" cy="463" r="1.8"/><circle cx="913" cy="430" r="2.2"/><circle cx="984" cy="392" r="1.7"/>
        <circle cx="1080" cy="359" r="2.3"/><circle cx="1171" cy="377" r="1.7"/><circle cx="1275" cy="337" r="2"/><circle cx="1391" cy="265" r="2.4"/>
      </g>
    </g>
    <g aria-hidden="true">
      <g class="spike">
        <path d="M622 413V278M662 436V216M699 452V302M738 466V162M776 476V252M814 482V116M852 470V286M891 450V202M931 421V266M971 395V179M1013 374V295"/>
      </g>
      <g class="spike-dot">
        <circle cx="622" cy="278" r="4"/><circle cx="662" cy="216" r="5"/><circle cx="699" cy="302" r="3.6"/><circle cx="738" cy="162" r="5.2"/><circle cx="776" cy="252" r="4"/><circle cx="814" cy="116" r="6"/><circle cx="852" cy="286" r="3.7"/><circle cx="891" cy="202" r="5"/><circle cx="931" cy="266" r="4"/><circle cx="971" cy="179" r="5.5"/><circle cx="1013" cy="295" r="3.8"/>
      </g>
      <g class="accent-dot" opacity=".62"><circle cx="814" cy="116" r="2.5"/><circle cx="738" cy="162" r="2"/><circle cx="971" cy="179" r="2.2"/></g>
    </g>
  </g>
</svg>
