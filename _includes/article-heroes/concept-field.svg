<svg class="article-hero-svg concept-field" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="concept-hero-title concept-hero-desc">
  <title id="concept-hero-title">Concept decomposition field</title>
  <desc id="concept-hero-desc">A dense representation cloud narrows through a layered bottleneck and separates into sparse concept streams before converging on a decision.</desc>
  <defs>
    <linearGradient id="concept-edge-fade" x1="0" x2="1"><stop offset="0" stop-color="black"/><stop offset=".06" stop-color="white"/><stop offset=".95" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
    <radialGradient id="concept-cloud" cx="42%" cy="52%" r="55%"><stop offset="0" stop-color="var(--accent)" stop-opacity=".12"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></radialGradient>
    <mask id="concept-fade"><rect width="1600" height="600" fill="url(#concept-edge-fade)"/></mask>
  </defs>
  <style>
    .concept-field .contour{fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .concept-field .fine{opacity:.12}.concept-field .mid{opacity:.22}.concept-field .near{opacity:.34}
    .concept-field .accent-line{fill:none;stroke:var(--accent);stroke-width:1.1;stroke-linecap:round;opacity:.5;vector-effect:non-scaling-stroke}
    .concept-field .separator{fill:var(--paper);fill-opacity:.8;stroke:currentColor;stroke-width:.8;opacity:.36;vector-effect:non-scaling-stroke}
    .concept-field .dot{fill:currentColor}.concept-field .focus{fill:var(--ink)}.concept-field .accent-dot{fill:var(--accent)}
    .concept-field .ascii{fill:currentColor;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;letter-spacing:3px;opacity:.27}
    .concept-field .dense{font-size:13px;letter-spacing:1.5px;opacity:.4}
    .concept-field .flow-1{animation:concept-flow-a 17s ease-in-out infinite alternate;transform-origin:50% 55%}
    .concept-field .flow-2{animation:concept-flow-b 21s ease-in-out infinite alternate;transform-origin:50% 55%}
    .concept-field .flow-3{animation:concept-flow-c 24s ease-in-out infinite alternate;transform-origin:50% 55%}
    .concept-field .flow-4{animation:concept-flow-d 19s ease-in-out infinite alternate;transform-origin:50% 55%}
    .concept-field .particles{animation:concept-pulse 22s ease-in-out infinite alternate}
    @keyframes concept-flow-a{from{transform:translateY(-1px) scaleY(.998)}to{transform:translateY(2px) scaleY(1.005)}}
    @keyframes concept-flow-b{from{transform:translateY(1.5px)}to{transform:translateY(-1.5px)}}
    @keyframes concept-flow-c{from{transform:translateY(-2px) scaleY(1.002)}to{transform:translateY(1px) scaleY(.997)}}
    @keyframes concept-flow-d{from{transform:translateY(1px)}to{transform:translateY(-2px)}}
    @keyframes concept-pulse{from{opacity:.68}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.hero-art *{animation:none!important}}
  </style>
  <g mask="url(#concept-fade)">
    <ellipse cx="380" cy="345" rx="320" ry="205" fill="url(#concept-cloud)"/>
    <g class="flow-1 fine contour">
      <path d="M14 314c126-80 276-130 420-96 120 28 169 121 294 127 123 6 190-69 302-116 126-53 228-71 373-29 78 23 126 66 184 106"/>
      <path d="M8 337c131-76 280-116 421-80 116 30 166 113 293 119 126 6 194-61 307-103 127-47 229-61 370-20 80 24 127 61 187 98"/>
      <path d="M7 360c135-71 283-102 421-64 114 31 163 105 291 112 129 6 198-53 312-91 127-42 231-51 368-11 82 24 128 56 189 91"/>
    </g>
    <g class="flow-2 mid contour">
      <path d="M18 384c136-66 283-88 419-49 111 32 160 97 289 104 132 7 202-45 317-79 128-37 232-41 366-2 83 24 129 51 190 84"/>
      <path d="M31 408c134-60 278-74 412-34 110 33 157 89 286 96 135 7 206-37 321-67 128-32 232-31 363 7 84 25 128 46 190 77"/>
      <path d="M51 432c130-54 272-60 404-19 108 34 154 81 283 88 137 7 210-29 326-55 128-27 231-21 358 16 85 25 127 41 188 70"/>
    </g>
    <g class="flow-3 near contour">
      <path d="M77 456c124-47 262-46 391-4 106 35 150 73 278 80 139 7 214-21 330-43 127-22 228-11 352 25 84 25 124 36 184 64"/>
      <path d="M111 480c116-40 250-32 376 11 103 35 145 65 272 72 140 8 216-13 333-31 125-17 224-1 345 33 82 24 120 31 178 58"/>
    </g>
    <!-- Representation layers: translucent planes, not literal network boxes. -->
    <g aria-hidden="true">
      <path class="separator" d="M557 245l75-42v278l-75-48z"/><path class="separator" d="M651 228l72-36v300l-72-42z"/><path class="separator" d="M742 237l68-31v273l-68-35z"/>
      <g class="ascii dense"><text x="575" y="310">.:+*:</text><text x="575" y="345">:+**.</text><text x="670" y="294">..+*:</text><text x="670" y="337">:**+.</text><text x="758" y="310">.:*:</text><text x="758" y="350">:+*.</text></g>
    </g>
    <!-- Four concept streams separate after the bottleneck. -->
    <g class="flow-4 contour mid">
      <path d="M792 322c121-12 166-131 283-140 75-6 114 30 171 52 84 32 144 7 217-31"/>
      <path d="M794 334c127-5 178-54 296-44 78 6 123 41 184 51 79 13 130-8 195-23"/>
      <path d="M794 347c128 4 180 59 297 69 78 7 126-24 187-30 80-8 130 20 194 39"/>
      <path d="M792 359c121 13 169 139 286 150 75 7 116-28 175-48 84-29 144 1 214 43"/>
    </g>
    <g class="accent-line">
      <path d="M804 322c117-16 161-128 271-140 72-8 111 27 170 50"/><path d="M804 347c124 2 177 55 287 69 77 10 126-19 187-30"/>
    </g>
    <!-- Sparse concept neighborhoods. -->
    <g class="particles">
      <g class="ascii">
        <text x="201" y="294">.::--++**++--::.</text><text class="dense" x="246" y="337">..::++****++::..</text><text x="291" y="381">.:--++**++--:.</text>
        <text class="dense" x="1004" y="202">.:+**+:.  .:+*:</text><text class="dense" x="1070" y="305">..:+***++:..</text><text class="dense" x="1082" y="430">.:++**++:.</text><text class="dense" x="1007" y="520">..:+***+:..</text>
      </g>
      <g class="dot" opacity=".23">
        <circle cx="164" cy="277" r="2"/><circle cx="213" cy="242" r="2.4"/><circle cx="271" cy="267" r="1.8"/><circle cx="318" cy="226" r="2.2"/><circle cx="366" cy="296" r="1.7"/><circle cx="421" cy="259" r="2.3"/><circle cx="465" cy="331" r="1.7"/><circle cx="514" cy="358" r="2.2"/>
        <circle cx="1068" cy="178" r="2.2"/><circle cx="1123" cy="192" r="1.7"/><circle cx="1185" cy="222" r="2.4"/><circle cx="1087" cy="288" r="2"/><circle cx="1162" cy="315" r="2.3"/><circle cx="1113" cy="418" r="2"/><circle cx="1198" cy="392" r="2.4"/><circle cx="1084" cy="505" r="2.2"/>
      </g>
      <g class="focus"><circle cx="1075" cy="182" r="4.5"/><circle cx="1090" cy="290" r="4"/><circle cx="1091" cy="416" r="4.4"/><circle cx="1078" cy="509" r="4"/><circle cx="1510" cy="333" r="6"/></g>
      <g class="accent-dot" opacity=".65"><circle cx="1075" cy="182" r="2"/><circle cx="1091" cy="416" r="2"/><circle cx="1510" cy="333" r="2.7"/></g>
    </g>
    <!-- Decision convergence stays almost stationary. -->
    <g class="contour near" aria-hidden="true"><path d="M1260 232c97 29 136 80 250 101"/><path d="M1280 341c92 1 139-3 230-8"/><path d="M1265 456c95-27 135-86 245-123"/></g>
  </g>
</svg>
